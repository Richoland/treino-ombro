<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ombro">
<meta name="application-name" content="Ombro">
<meta name="description" content="Treino diário de ombro com elástico, com animações de cada exercício.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Treino de ombro</title>
<style>
:root{--bg:#0b0e14;--card:#151a24;--card2:#10141d;--line:#252c3b;--txt:#e8ecf3;--mut:#8a94a8;--acc:#5eead4;--band:#fbbf24;--pink:#f472b6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
body{max-width:540px;margin:0 auto;min-height:100vh}
button,a{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(11,14,20,.92);backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
header .t{flex:1;min-width:0}
header .t small{display:block;color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.dots{display:flex;gap:6px;margin-top:6px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--acc)}
.dots i.cur{background:#fff}
.ibtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:20px}
main{padding:6px 16px calc(160px + env(safe-area-inset-bottom))}
.badge{min-width:48px;height:48px;padding:0 12px;border-radius:24px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:700;color:var(--band);white-space:nowrap}
.restset{display:flex;align-items:center;gap:8px;margin-top:14px}
.restset span{color:var(--mut);font-size:14px;margin-right:2px}
.restset button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;color:var(--mut)}
.restset button.on{border-color:var(--band);color:var(--band);background:rgba(251,191,36,.1)}
.train{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.train .nums{display:flex;gap:12px;text-align:center}
.train .nums div{flex:1;background:var(--card2);border-radius:14px;padding:10px 6px}
.train .nums b{display:block;font-size:34px;line-height:1.1;color:var(--acc)}
.train .nums span{font-size:13px;color:var(--mut)}
.train .big{width:100%;min-height:68px;margin-top:14px;border-radius:18px;border:0;background:var(--acc);color:#06221e;font-size:20px;font-weight:800}
.train .okay{margin-top:14px;min-height:68px;border-radius:18px;display:grid;place-items:center;background:rgba(94,234,212,.12);color:var(--acc);font-weight:700;font-size:18px}
.train p{margin:10px 0 0;font-size:14px;color:var(--mut);text-align:center}
.safe{max-width:508px;margin:0 auto 10px;font-size:12px;line-height:1.3;color:#f9a8d4;text-align:center}
h1{font-size:26px;line-height:1.15;margin:8px 0 8px}
.vol{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.vol span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:#cfd6e4}
.vol span.hi{border-color:transparent;background:rgba(94,234,212,.14);color:var(--acc);font-weight:600}
.anim{background:var(--card2);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.anim svg{display:block;width:100%;height:auto;max-height:30vh}
.anim text{font-family:inherit}
.tempo{padding:10px 16px 14px}
.tempo .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mut)}
.tempo b{color:var(--acc);font-size:16px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transform-origin:left;transform:scaleX(0)}
.chips{display:flex;gap:8px;margin:12px 0 0}
.chips button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:16px}
.chips button.on{background:var(--acc);color:#06221e;border-color:var(--acc)}
.desc{margin:10px 2px 0;color:#cfd6e4}
h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:24px 0 10px}
ol,ul{margin:0;padding:0;list-style:none}
ol{counter-reset:s}
ol li{counter-increment:s;position:relative;padding:0 0 12px 44px;min-height:32px}
ol li:before{content:counter(s);position:absolute;left:0;top:-2px;width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--acc)}
ul li{position:relative;padding:12px 14px 12px 42px;background:var(--card);border-radius:14px;margin-bottom:8px}
ul li:before{content:"";position:absolute;left:16px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--band)}
.sets{display:flex;gap:12px;align-items:center}
.sets button{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:22px;font-weight:700;color:var(--mut)}
.sets button.done{background:var(--acc);border-color:var(--acc);color:#06221e}
#rest{margin-top:12px;display:flex;align-items:center;gap:12px;background:rgba(251,191,36,.12);border-radius:14px;padding:10px 10px 10px 16px;color:var(--band)}
#rest[hidden]{display:none}
#rest span{flex:1}
#rest b{font-size:20px;font-variant-numeric:tabular-nums}
#rest button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid rgba(251,191,36,.4);background:none}
.video{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:24px;min-height:54px;border-radius:14px;border:1px solid var(--line);text-decoration:none;color:#cfd6e4;font-weight:600}
.video small{color:var(--mut);font-weight:400}
.volline{margin:0 0 12px;color:var(--mut);font-size:14px}
#exp{scroll-margin-top:84px}
.expbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;margin-top:22px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:18px}
.expbtn i{font-style:normal;color:var(--acc);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.expbtn.open{border-color:var(--acc)}
.expbtn.open i{transform:rotate(180deg)}
.panel{animation:up .45s cubic-bezier(.2,.9,.3,1)}
.panel p{margin:0;color:#cfd6e4}
.panel p.err{background:rgba(244,114,182,.12);color:#f9a8d4;border-radius:14px;padding:12px 14px}
.panel p.feel{background:rgba(94,234,212,.1);color:var(--acc);border-radius:14px;padding:12px 14px}
.yt{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.panel .video{margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
nav div{max-width:508px;margin:0 auto;display:flex;gap:12px}
nav button{flex:1;min-height:62px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:18px}
nav button.next{flex:1.5;background:var(--acc);border-color:var(--acc);color:#06221e}
nav button:disabled{opacity:.35}
button,.video{transition:transform .45s cubic-bezier(.34,1.56,.64,1),background-color .2s,border-color .2s,color .2s}
button:active,.video:active{transform:scale(.94);transition-duration:.08s}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .5s cubic-bezier(.3,.7,.4,1)}
.train .nums b.pop{display:block}
@keyframes enter{from{opacity:0;transform:translateX(var(--dx,22px))}to{opacity:1;transform:none}}
main.enter{animation:enter .45s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
#sheet .in{animation:up .45s cubic-bezier(.2,.9,.3,1)}
/* layout compacto: séries e o botão Explicação cabem sem rolar em 390x844 */
header{padding-bottom:8px}
.ibtn{width:42px;height:42px;font-size:18px}
.badge{min-width:42px;height:42px}
main{padding-top:2px}
h1{font-size:22px;margin:6px 0 4px}
.volline{margin:0 0 8px}
.tempo{padding:6px 14px 10px}
.bar{margin-top:6px}
.chips{margin-top:8px}
.chips button{min-height:46px}
.desc{margin:6px 2px 0;font-size:14.5px;line-height:1.35}
h2{margin:16px 0 8px}
.sets button{width:56px;height:56px;font-size:20px}
.expbtn{margin-top:14px;min-height:54px}
.safe{margin-bottom:8px}
nav{padding-top:8px}
nav button{min-height:56px}
.cf{position:fixed;z-index:20;width:10px;height:10px;border-radius:3px;pointer-events:none}
#sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .in{width:100%;max-width:540px;max-height:88vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 6px;font-size:22px}
#sheet p{margin:6px 0;color:#cfd6e4}
#sheet .warn{background:rgba(244,114,182,.12);color:#f9a8d4;border-radius:14px;padding:12px 14px;margin-top:6px}
#sheet .btns{display:flex;gap:12px;margin-top:18px}
#sheet .btns button{flex:1;min-height:56px;border-radius:16px;border:1px solid var(--line);background:none;font-weight:700}
#sheet .btns button.pri{background:var(--acc);border-color:var(--acc);color:#06221e}
</style>
</head>
<body>
<header>
  <div class="t"><small id="step"></small><div class="dots" id="dots"></div></div>
  <div class="badge" id="badge" aria-label="Dias seguidos"></div>
  <button class="ibtn" onclick="openSheet(false)" aria-label="Regras da ficha">i</button>
</header>
<main id="main"><div id="top"></div><div id="exp"></div><div id="foot"></div></main>
<nav><p class="safe">Dor, travamento ou perda de força? Pare e procure um ortopedista ou fisioterapeuta.</p><div>
  <button id="prev" onclick="go(-1)">‹ Anterior</button>
  <button id="next" class="next" onclick="go(1)">Próximo ›</button>
</div></nav>
<div id="sheet" hidden onclick="if(event.target===this)closeSheet()"><div class="in" id="sheetIn"></div></div>

<script>
/* ============ desenho ============ */
const BODY='#aab3c5',TORSO='#46506a',FAR='#67718a',ACC='#5eead4',BAND='#fbbf24',PINK='#f472b6',DIM='#2a3244',TXT='#8a94a8',HAND='#e6fffb',DARK='#10141d',WOOD='#3b4560';
const PI=Math.PI,rad=d=>d*PI/180,lerp=(a,b,p)=>a+(b-a)*p,lp=(a,b,p)=>[lerp(a[0],b[0],p),lerp(a[1],b[1],p)];
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const f=n=>n.toFixed(1);
const ln=(x1,y1,x2,y2,c,w,ex='')=>`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${c}" stroke-width="${f(w)}" stroke-linecap="round" ${ex}/>`;
const pl=(pts,c,w,ex='')=>`<polyline points="${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="none" stroke="${c}" stroke-width="${f(w)}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;
const ci=(x,y,r,c,ex='')=>`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${c}" ${ex}/>`;
const tx=(x,y,s,c=TXT,size=10,anchor='middle',ex='')=>`<text x="${x}" y="${y}" fill="${c}" font-size="${size}" text-anchor="${anchor}" font-weight="600" ${ex}>${s}</text>`;
const FLOOR=ln(16,251,284,251,DIM,3);
/* mola amortecida: cada valor nomeado persegue o alvo com rigidez w e amortecimento z */
let SPR={},DT=1/60;
function sp(name,target,w=9,z=.65,init){
  let s=SPR[name];if(!s)s=SPR[name]={x:init===undefined?target:init,v:0};
  const k=w*w,c=2*z*w;
  for(let r=DT;r>1e-6;){const h=Math.min(r,1/240);s.v+=(k*(target-s.x)-c*s.v)*h;s.x+=s.v*h;r-=h;}
  return s.x;
}
const cl=x=>x<0?0:x>1?1:x;
/* elástico: curva que atrasa um pouco em relação às mãos e cede quando está frouxo */
function band(a,b,st,w=5,key='bw',amp=60){
  const l=sp(key,st,16,.5),dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,o=(st-l)*amp;
  const mx=(a[0]+b[0])/2-dy/L*o,my=(a[1]+b[1])/2+dx/L*o+(1-cl(st))*amp/20;
  return `<path d="M${f(a[0])} ${f(a[1])} Q${f(mx)} ${f(my)} ${f(b[0])} ${f(b[1])}" fill="none" stroke="${BAND}" stroke-width="${f(lerp(w,w*.55,cl(st)))}" stroke-linecap="round"/>`;
}
const box=(x,y,label,inner)=>`<g transform="translate(${x} ${y})"><rect width="96" height="84" rx="12" fill="#0b0e14" stroke="${DIM}" stroke-width="1.5"/>${tx(48,14,label,TXT,8.5)}${inner}</g>`;

/* ciclo 2s ida, pausa, 2s volta, pausa */
function cyc(t,a='Ida',b='Volta',hold=.5){
  const x=t%(4.5+hold),D=1.7;let g,label,bar;
  if(x<2){g=ease(Math.min(1,x/D));label=a+' · 2s';bar=x/2;}
  else if(x<2+hold){g=1;label=hold>=1?'Segura '+hold+'s':'Segura';bar=1;}
  else if(x<4+hold){g=1-ease(Math.min(1,(x-2-hold)/D));label=b+' · 2s';bar=1-(x-2-hold)/2;}
  else{g=0;label='Pausa';bar=0;}
  /* p: articulação principal segue o alvo por mola; q: ponta (mão) segue p com um leve atraso */
  const p=sp('p',g,9,.65),q=sp('q',p,10,.75);
  return{p,q,pc:cl(p),qc:cl(q),label,bar};
}

function frontBody(face=true){
  return ln(138,166,134,244,BODY,13)+ln(162,166,166,244,BODY,13)
   +`<path d="M120 80 Q150 72 180 80 L172 168 Q150 176 128 168 Z" fill="${TORSO}" stroke="${TORSO}" stroke-width="8" stroke-linejoin="round"/>`
   +ln(150,62,150,76,BODY,9)+ci(150,46,19,BODY)
   +(face?ci(143,44,2.2,DARK)+ci(157,44,2.2,DARK)+`<path d="M143 53 Q150 58 157 53" stroke="${DARK}" stroke-width="2" fill="none" stroke-linecap="round"/>`:'');
}
function sideBody(x,split){
  const legs=split
    ? ln(x-4,158,x-26,244,FAR,13)+ln(x-26,246,x-14,246,FAR,8)+ln(x-4,158,x+16,244,BODY,13)+ln(x+16,246,x+28,246,BODY,8)
    : ln(x-4,158,x-8,244,FAR,13)+ln(x-4,158,x+4,244,BODY,13)+ln(x+4,246,x+16,246,BODY,8);
  return legs+ln(x,80,x-4,158,TORSO,26)+ln(x+1,62,x,74,BODY,9)+ci(x+3,46,18,BODY)+ci(x+21,49,3.5,BODY)+ci(x+13,43,2.2,DARK);
}
const pole=x=>ln(x,24,x,249,WOOD,7);

/* vista de cima para as rotações */
function topRot(x0,y0,cx,th,anchor,st){
  const cy=40,e=[cx+22,cy+3],h=[e[0]+24*Math.sin(th),e[1]+24*Math.cos(th)];
  return box(x0,y0,'visto de cima',
    `<ellipse cx="${cx}" cy="${cy}" rx="24" ry="9" fill="${TORSO}"/>`+ci(cx,cy+9,2.5,BODY)+ci(cx,cy,9,BODY)
    +band(anchor,h,st,3,'bi',20)+ci(anchor[0],anchor[1],3,BAND)+ln(e[0],e[1],h[0],h[1],ACC,5)+ci(e[0],e[1],3.4,ACC)+ci(h[0],h[1],3.6,HAND));
}

/* 1 e 2: rotações (de frente, antebraço em perspectiva) */
function rotation(external){
  return t=>{
    const c=cyc(t,external?'Gira pra fora':'Puxa pra barriga','Volta devagar');
    const th=rad(external?lerp(-50,40,c.p):lerp(40,-50,c.p));
    const S=[182,86],E=[188,134],H=[E[0]+46*Math.sin(th),E[1]+46*Math.cos(th)*.38];
    const ax=external?30:270,A=[external?36:264,140];
    const arcEnd='217.6 147.4';
    const svg=FLOOR+pole(ax)+ci(A[0],A[1],5,BAND)
      +(external?tx(46,128,'âncora',BAND,9,'start'):tx(256,128,'âncora',BAND,9,'end'))
      +frontBody()+pl([[118,86],[110,130],[114,172]],BODY,11)
      +(external?`<rect x="173" y="116" width="12" height="24" rx="6" fill="${PINK}"/>`+tx(214,114,'toalha',PINK,9):'')
      +`<path d="M152.8 145.2 A46 17.5 0 0 0 ${arcEnd}" fill="none" stroke="#5a6580" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>`
      +band(A,H,c.p)
      +pl([S,E,H],ACC,11)+ci(E[0],E[1],4,'#2bb5a3')+ci(H[0],H[1],6.5+2*Math.cos(th),HAND)
      +(external?topRot(196,166,44,th,[7,52],c.p):topRot(8,166,34,th,[90,52],c.p));
    return{svg,label:c.label,bar:c.bar};
  };
}

/* 3: pull-apart */
function pullApart(t){
  /* mãos sempre na mesma linha horizontal, na altura do peito: começam à frente (em perspectiva, mão maior) e só abrem pros lados até o T */
  const c=cyc(t,'Abre','Volta devagar'),ph=rad(lerp(0,90,c.p)),s=Math.sin(ph),co=Math.cos(ph),Y=95;
  const HR=[182+72*s,Y],HL=[118-72*s,Y];
  const ER=[182+36*s,(86+Y)/2+2*co],EL=[118-36*s,ER[1]];
  const r=6.5+3.5*co;
  const cx=48,cy=36,hr=[cx+16+26*s,cy+2+26*co],hl=[cx-16-26*s,hr[1]];
  let sc='';
  for(const k of[-1,1])sc+=ln(cx+k*(10-5*c.pc),cy-10,cx+k*(10-5*c.pc),cy-5,BODY,2.5);
  const inset=box(8,166,'visto de cima',
    `<ellipse cx="${cx}" cy="${cy}" rx="19" ry="8" fill="${TORSO}"/>`+sc+ci(cx,cy+8,2.5,BODY)+ci(cx,cy,8,BODY)
    +band(hl,hr,c.p,3,'bi',20)+ln(cx+16,cy+2,hr[0],hr[1],ACC,4.5)+ln(cx-16,cy+2,hl[0],hl[1],ACC,4.5)+ci(hr[0],hr[1],3.4,HAND)+ci(hl[0],hl[1],3.4,HAND));
  const svg=FLOOR+frontBody()+tx(150,17,'→ escápulas ←',ACC,9,'middle',`opacity="${f(.2+.8*c.pc)}"`)+band(HL,HR,c.p)
    +pl([[182,86],ER,HR],ACC,11)+pl([[118,86],EL,HL],ACC,11)+ci(HR[0],HR[1],r,HAND)+ci(HL[0],HL[1],r,HAND)+inset;
  return{svg,label:c.label,bar:c.bar};
}

/* 4: face pull (de lado + mini de frente) */
function facePull(t){
  /* âncora na altura dos olhos; no fim a mão fica ao lado da orelha (atrás da linha do rosto) e o cotovelo alto, pra fora e pra trás */
  const c=cyc(t,'Puxa','Volta devagar'),p=c.p,A=[274,44];
  const q=c.q,S=[105,88],E=lp([146,74],[84,80],p),H=lp([186,58],[100,45],q);
  const E2=[E[0]+8,E[1]-3],H2=[H[0]+6,H[1]-3];
  let arms='';
  for(const s of[-1,1]){
    const sh=[48+s*15,41],e=lp([48+s*11,51],[48+s*30,37],p),h=lp([48+s*4,41],[48+s*15,26],q);
    arms+=pl([sh,e,h],ACC,4.5)+ci(h[0],h[1],lerp(4.6,3.4,q),HAND);
  }
  const inset=box(196,166,'de frente',
    `<path d="M35 41 L61 41 L58 74 L38 74 Z" fill="${TORSO}" stroke="${TORSO}" stroke-width="5" stroke-linejoin="round"/>`+ci(48,27,8,BODY)+arms);
  const svg=FLOOR+pole(280)+ci(A[0],A[1],5,BAND)+tx(266,32,'âncora',BAND,9,'end')
    +pl([[109,86],E2,H2],FAR,10)+ln(A[0],A[1],H2[0],H2[1],'#b98a14',lerp(3.5,2.2,c.pc))+band(A,H,p,4.5)

/* 5: Y-T-W (visto de cima + mini de lado) */
function ytw(letter){
  return t=>{
    const c=cyc(t,'Sobe','Desce',2),p=c.p;
    let arms='',sh='';
    for(const s of[-1,1]){
      const S=[150+s*24,97];let E,H;
      if(letter==='Y'){H=[S[0]+s*44.8,97-63.9];E=[(S[0]+H[0])/2,(S[1]+H[1])/2];}
      else if(letter==='T'){H=[S[0]+s*78,97];E=[(S[0]+H[0])/2,97];}
      else{E=[S[0]+s*(34-4*p),113+3*p];H=[E[0]+s*12,E[1]-38];}
      const pts=[S,E,H],lift=[1*c.pc,5*c.pc,9*c.qc];
      sh+=pl(pts.map((u,i)=>[u[0],u[1]+lift[i]]),'#000',11,`opacity="${f(.45*c.pc)}"`);
      arms+=pl(pts,ACC,11+1.5*c.pc)+ci(H[0],H[1],6.5+c.qc,HAND)+(letter==='Y'?ci(H[0],H[1],2.6,ACC):'');
    }

    else if(letter==='T'){const hy=60-8*c.q;side=ci(57,hy,5.5,ACC)+ci(57,hy,2.6,HAND);}
    else{const e=[43,61-5*c.p],h=[61,60-8*c.q];side=ln(e[0],e[1],h[0],h[1],ACC,4.5)+ci(e[0],e[1],3,'#2bb5a3')+ci(h[0],h[1],3.3,HAND);}
    let scap='';
    for(const s of[-1,1])scap+=ln(150+s*(17-6*p),104,150+s*(14-6*p),128,BODY,4,'opacity=".75"');
    const inset=box(8,166,'de lado',

      +ln(13,59,58,59,TORSO,9)+ci(70,55,7,BODY)+side+tx(48,78,'só poucos cm',TXT,8));
    const svg=`<rect x="106" y="22" width="88" height="232" rx="14" fill="#171d2b"/>`
      +tx(246,244,letter,'#232b3d',72)+(letter==='Y'?tx(246,15,'polegar pra cima',ACC,9):'')
      +`<rect x="132" y="33" width="36" height="22" rx="7" fill="${PINK}" opacity=".85"/>`
      +ln(141,178,139,248,BODY,13)+ln(159,178,161,248,BODY,13)+sh
      +`<path d="M126 94 Q150 86 174 94 L168 178 Q150 184 132 178 Z" fill="${TORSO}" stroke="${TORSO}" stroke-width="8" stroke-linejoin="round"/>`
      +scap+ln(150,76,150,88,BODY,9)+ci(150,62,17,BODY)+arms+inset;
    return{svg,label:c.label,bar:c.bar};
  };
}

/* aquecimento */
function circles(t){
  /* os dois braços abertos na altura dos ombros, girando a partir do ombro; 10 voltas pra frente (1s cada) e 10 pra trás, círculo crescendo aos poucos */
  const x=t%20,fwd=x<10,u=(x%10)/10,n=u*10;
  const a=sp('a',2*PI*(fwd?n:10-n),10,.8),r=sp('r',lerp(6,18,u),5,.9);
  const v=r*Math.cos(a),d=r*Math.sin(a),k=d/r; /* v: sobe/desce; d: frente/trás (k de -1 a 1) */
  let arms='';
  for(const s of[-1,1]){
    const S=[150+s*32,86],C=[150+s*104,86],H=[C[0]+s*d*.6,C[1]-v];
    arms+=`<ellipse cx="${C[0]}" cy="${C[1]}" rx="${f(r*.6)}" ry="${f(r)}" fill="none" stroke="#5a6580" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>`
      +ln(S[0],S[1],H[0],H[1],ACC,11)+ci(H[0],H[1],6.5+3*k,HAND);
  }
  /* quadrinho de lado em leve perspectiva: braço de perto vem na nossa direção, o de longe vai pro outro lado; mão gira em volta da ponta do braço, na altura do ombro */
  const ri=lerp(3,8,cl((r-6)/12)),rf=ri*.55;
  const hn=[20+ri*Math.sin(a),50-ri*Math.cos(a)],hf=[58+rf*Math.sin(a),43-rf*Math.cos(a)];
  const inset=box(8,166,'de lado',
    ln(43,45,hf[0],hf[1],FAR,3.5)+ci(hf[0],hf[1],2.6,FAR)
    +ln(40,46,39,76,TORSO,13)+ci(42,30,8,BODY)+ci(51,31,2.2,BODY)
    +`<circle cx="20" cy="50" r="${f(ri)}" fill="none" stroke="#5a6580" stroke-width="1.5" stroke-dasharray="2 4"/>`
    +ln(37,47,hn[0],hn[1],ACC,5)+ci(hn[0],hn[1],4.5,HAND)+tx(78,64,fwd?'↻':'↺',ACC,20));
  const svg=FLOOR+frontBody()+arms+inset;
  return{svg,label:(fwd?'Pra frente':'Pra trás')+' · '+Math.min(10,Math.floor(n)+1)+'/10',bar:u};
}
function pendulum(t){
  const a=2*PI*t/2.4,m=sp('amp',1,3,.9,0),S=[172,116],H=[172+24*m*Math.cos(a),190+6*m*Math.sin(a)];
  const svg=FLOOR+ln(212,142,286,142,WOOD,7)+ln(272,142,272,249,WOOD,6)
    +pl([[112,152],[117,200],[106,244]],FAR,13)+pl([[112,152],[125,200],[120,244]],BODY,13)+ln(120,246,132,246,BODY,8)
    +pl([[176,112],[200,128],[224,136]],FAR,10)
    +ln(112,150,174,112,TORSO,26)+ln(180,108,190,104,BODY,9)+ci(200,100,17,BODY)+ci(213,113,3.5,BODY)+ci(209,102,2.2,DARK)
    +`<ellipse cx="172" cy="190" rx="24" ry="6" fill="none" stroke="#3a4359" stroke-width="2" stroke-dasharray="3 6"/>`
    +ln(S[0],S[1],H[0],H[1],ACC,10)+ci(H[0],H[1],7,HAND)+tx(246,132,'apoio',TXT,9);
  return{svg,label:'Braço solto, balanço leve',bar:(t%2.4)/2.4};
}
function scap(t){
  const c=cyc(t,'Aperta','Solta'),p=c.p;
  let s2='',arms='';
  for(const s of[-1,1]){
    const cx=150+s*(23-10*p);
    s2+=`<path d="M${f(cx-s*6)} 94 L${f(cx+s*10)} 98 L${f(cx-s*3)} 126 Z" fill="${BODY}" stroke="${BODY}" stroke-width="4" stroke-linejoin="round" opacity=".9"/>`;
    arms+=pl([[150+s*(32-2*p),86],[150+s*(40-4*p),130],[150+s*(36-2*c.q),172]],BODY,11);
    s2+=tx(150+s*64,118,s<0?'→':'←',ACC,22,'middle',`opacity="${f(.25+.75*c.pc)}"`);
  }
  const svg=FLOOR+frontBody(false)+arms+ln(150,84,150,162,'#5a6580',2,'stroke-dasharray="2 6"')+s2;
  return{svg,label:c.label,bar:c.bar};
}

const $=s=>document.querySelector(s),KEY='treino-ombro-v1',today=new Date().toDateString();

let vi=0,anim=null,t0=0,lastLabel='',restEnd=0,restInt=null,sheetFin=false;
let cfg={rest:45},log=[],popSet=0,justTrained=false,lastNow=0;
function celebrate(x,y){
  const cols=[ACC,BAND,PINK,'#ffffff'];
  for(let i=0;i<28;i++){
    const e=document.createElement('i');e.className='cf';
    e.style.cssText='left:'+x+'px;top:'+y+'px;background:'+cols[i%4];
    if(!e.animate)return;
    document.body.appendChild(e);
    const a=-PI/2+(Math.random()-.5)*2.6,d=80+Math.random()*150,dx=Math.cos(a)*d,dy=Math.sin(a)*d;
    e.animate([
      {transform:'translate(-50%,-50%) scale(.3)',opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*360}deg) scale(1)`,opacity:1,offset:.45},
      {transform:`translate(${dx*1.15}px,${dy+130}px) rotate(${Math.random()*720}deg) scale(.7)`,opacity:0}
    ],{duration:1000+Math.random()*500,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>e.remove();
  }
}
try{const c=JSON.parse(localStorage.getItem(KEY+'-cfg'));if(c&&c.rest>=45&&c.rest<=60)cfg=c;}catch(e){}
try{const l=JSON.parse(localStorage.getItem(KEY+'-log'));if(Array.isArray(l))log=l;}catch(e){}
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function stats(){
  const set=new Set(log),d=new Date(),didToday=set.has(dk(d));
  if(!didToday)d.setDate(d.getDate()-1);
  let streak=0;
  while(set.has(dk(d))){streak++;d.setDate(d.getDate()-1);}
  return{didToday,streak,total:set.size};
}
function trainCard(){
  const s=stats();
  return `<div class="train"><div class="nums">
    <div><b class="${justTrained?'pop':''}">${s.streak}</b><span>${s.streak===1?'dia seguido':'dias seguidos'}</span></div>
    <div><b class="${justTrained?'pop':''}">${s.total}</b><span>${s.total===1?'treino no total':'treinos no total'}</span></div></div>`
    +(s.didToday?'<div class="okay'+(justTrained?' pop':'')+'">✓ Treino de hoje marcado</div><p>Volta amanhã pra manter a sequência.</p>'
      :'<button class="big" onclick="trained(this)">Treinei hoje</button>'+(s.streak?'<p>Marca hoje pra não quebrar a sequência.</p>':''))
    +'</div>';
}
function trained(btn){
  const k=dk(new Date()),r=btn&&btn.getBoundingClientRect();
  if(!log.includes(k)){log.push(k);try{localStorage.setItem(KEY+'-log',JSON.stringify(log));}catch(e){}}
  if(navigator.vibrate)navigator.vibrate(80);
  justTrained=true;
  const y=scrollY;render();scrollTo(0,y);
  if(!$('#sheet').hidden)openSheet(sheetFin);
  justTrained=false;
  if(r)celebrate(r.left+r.width/2,r.top+r.height/2);
}
/* "Concluir": já marca o treino de hoje (se ainda não marcou) e comemora */
function finish(){
  const k=dk(new Date()),isNew=!log.includes(k);
  if(isNew){log.push(k);try{localStorage.setItem(KEY+'-log',JSON.stringify(log));}catch(e){}if(navigator.vibrate)navigator.vibrate(80);}
  justTrained=isNew;
  render();openSheet(true);
  justTrained=false;
  if(isNew)celebrate(innerWidth/2,innerHeight*.45);
}
function setRest(s){
  if(restEnd)restEnd+=(s-cfg.rest)*1000;
  cfg.rest=s;try{localStorage.setItem(KEY+'-cfg',JSON.stringify(cfg));}catch(e){}

}

  if(i<0)return;
  st.idx=i;vi=0;save();render();scrollTo(0,0);
  const m=$('#main');m.style.setProperty('--dx',(d>0?22:-22)+'px');m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter');
}
function setDone(i){
  const ex=EX[st.idx],cur=st.done[ex.id]||0,n=cur===i?i-1:i,y=scrollY;
  st.done[ex.id]=n;save();
  if(n>cur)popSet=n;
  if(ex.noRest&&ex.variants&&n>cur)vi=Math.min(n,ex.variants.length-1); /* aquecimento: já mostra o próximo movimento */
  if(n>cur&&n<ex.sets&&!ex.noRest)startRest();else stopRest();
  render();scrollTo(0,y);
}
function startRest(){restEnd=Date.now()+cfg.rest*1000;clearInterval(restInt);restInt=setInterval(tick,250);}
function stopRest(){restEnd=0;clearInterval(restInt);restInt=null;const el=$('#rest');if(el)el.hidden=true;}
function tick(){
  const el=$('#rest');if(!restEnd)return;
  const s=Math.ceil((restEnd-Date.now())/1000);
  if(s<=0){stopRest();if(navigator.vibrate)navigator.vibrate([200,100,200]);return;}
  if(el){el.hidden=false;$('#restTxt').innerHTML='Descanso <b>'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</b>';}
}
function openSheet(fin){
  sheetFin=fin;
  $('#sheetIn').innerHTML=
    `<h3>${fin?'Treino concluído 💪':'Ficha 1: ombro com elástico'}</h3>
     <p>${fin?'Boa, Ricardo. Amanhã tem de novo.':'Todo dia, 15 a 20 min, com elástico leve.'}</p>
     ${trainCard()}
     <h2>Regra geral</h2><p>2 a 3 séries de 12 a 15, devagar: 2s na ida, 2s na volta. Descanso de 45 a 60s. Nos unilaterais, faz os dois lados.</p>
     <p>Estalo sem dor é ok. Não força o final do movimento.</p>
     <h2>Progressão</h2><p>Quando 3 × 15 ficar fácil com a forma limpa, passa pra um elástico um pouco mais firme.</p>
     <h2>Segurança</h2><p class="warn">Se aparecer dor, travamento ou perda de força: para e procura um ortopedista ou fisioterapeuta.</p>
     <div class="btns">${fin?'<button onclick="restart()">Recomeçar</button>':''}<button class="pri" onclick="closeSheet()">Fechar</button></div>`;
  $('#sheet').hidden=false;
}
function closeSheet(){$('#sheet').hidden=true;}
function restart(){st={date:today,idx:0,done:{}};vi=0;save();stopRest();closeSheet();render();scrollTo(0,0);}

function frame(now){
  const svg=$('#svg');
  DT=Math.min(.05,Math.max(0,(now-lastNow)/1000));lastNow=now;
  if(svg&&anim){
    const r=anim(Math.max(0,(now-t0)/1000));
    svg.innerHTML=r.svg;
    if(r.label!==lastLabel){$('#lab').textContent=lastLabel=r.label;}
    $('#bar').style.transform='scaleX('+r.bar.toFixed(3)+')';
  }
  requestAnimationFrame(frame);
}
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
if(!(st.idx>=0&&st.idx<EX.length))st.idx=0;
if(EX[st.idx].noRest)vi=Math.min(st.done[EX[st.idx].id]||0,EX[st.idx].variants.length-1); /* retoma o aquecimento no movimento onde parou */
render();requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
